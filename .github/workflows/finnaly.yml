name: CI — Build IPA (latest Xcode)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      scheme:
        description: 'Xcode scheme (optional — auto-detect if empty)'
        required: false
        default: ''
      export_method:
        description: 'Export method: app-store | ad-hoc | development | enterprise'
        required: false
        default: 'ad-hoc'
      team_id:
        description: 'Optional Apple Team ID to include in exportOptions.plist'
        required: false
        default: ''
      use_provisioning_files:
        description: 'If true, install CERT_P12 + PROV_PROFILE from secrets instead of using -allowProvisioningUpdates'
        required: false
        default: 'false'

jobs:
  build:
    name: Build and export IPA
    runs-on: macos-latest
    env:
      # Secrets (optional) to provide via GitHub repo Settings → Secrets:
      # CERT_P12      - base64-encoded .p12 certificate (optional)
      # CERT_PASSWORD - password for the .p12 certificate (optional)
      # PROV_PROFILE  - base64-encoded provisioning profile (.mobileprovision) (optional)
      CERT_P12: ${{ secrets.CERT_P12 }}
      CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
      PROV_PROFILE: ${{ secrets.PROV_PROFILE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Install tooling
        run: |
          set -e
          gem install --no-document xcpretty || true
          # Install CocoaPods if Podfile exists
          if [ -f Podfile ]; then
            sudo gem install cocoapods --no-document || true
            pod repo update || true
            pod install --repo-update || true
          fi

      - name: (Optional) Install certificate & provisioning profile from secrets
        if: ${{ inputs.use_provisioning_files == 'true' }}
        run: |
          set -e
          if [ -z "$CERT_P12" ] || [ -](#)
